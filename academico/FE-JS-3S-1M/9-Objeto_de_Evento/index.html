<!DOCTYPE html>
<html>
    <head>
        <title>Form e Javascript</title>
        <style>
            .aprovado  { color: green; font-weight: bold; }
            .reprovado { color: red;   font-weight: bold; }
        </style>
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1>Form e Javascript</h1>
        <form id="meuForm" method="post">
            <label for="campoNome">Nome do Aluno:</label>
            <input type="text" id="campoNome"
                   required minlength="3"
                   placeholder="Digite o nome"><br>

            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" step="0.1" min="0" max="10" required placeholder="0.0"><br>
            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" step="0.1" min="0" max="10" required placeholder="0.0"><br>
            <div class="controles">
                <button type="submit">Calcular</button>
                <button type="button" id="btnLimpar">Limpar</button>
                <button type="button" id="teste">Teste</button>
            </div>
        </form>
        <div id="resultado" aria-live="polite"></div>
    </body>
</html>
