<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 8 - Formulário e Evento</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1 onclick="document.querySelector('h1').style.color='red'">Aula 8 - Manipulação de Formulários com JS</h1> <!--onclick pode ser inserido em qlqr elemento -->
    <form id="form1" method="get">
        <label for="nome">Nome</label>
        <input  type="text" id="nome" placeholder="Digite seu nome..." ><br>
        <label for="senha">Digite sua senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha..."><br>
        <label for="ra">Digite seu RA:</label>
        <input type="number"  id="ra" placeholder="Digite seu RA"><br>
        <label for="av1">Digite a nota AV1:</label>
        <input type="number" id="av1" step="0.1" placeholder="Digite a nota AV1" value="8"><br> <!-- values = mantém um valor fixo-->
        <label for="av2">Digite a nota AV2:</label>
        <input type="number" id="av2" step="0.1" placeholder="Digite a nota AV2"><br> <!--step é o "pulo/espaço" entre os números-->
        <button type="button" onclick="document.querySelector('body').style.backgroundColor='purple'">ENVIAR</button> <!--onclick =  ativação de evento-->
        <!-- neste exemplo foi aplicado o evento de mudar a cor de fundo ao clicar no botão -->
        <button type="button" onclick="funciona()">Inserir</button>
        <!-- type button = não envia os dados diretamente, assim podemos tratar o envio dos dados antes-->

        <input type="reset" value="Limpar" onclick="limpar()"> <!--reset = voltar ao estado original-->
    </form><br>    

    <div id="saida">Saida</div>
    <p class="teste">teste</p>

</body>
</html>
